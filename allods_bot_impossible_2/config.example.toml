# Настройки бота. Скопируйте в config.toml и поправьте под своего персонажа.
# Имена клавиш: a–z, 0–9, f1–f12, tab, space, enter, esc, shift, ctrl, alt,
# up/down/left/right, а также сочетания вида "ctrl+1".

[input]
# Клавиши всегда идут через PS/2 (драйвер InpOut от Clickermann), как #ps2_keyboard.
# Мышь:
#   "sendinput" — курсор двигается, клики игра не принимает (как мышь Clickermann без #ps2_mouse);
#   "ps2"       — пакеты PS/2-мыши, как #ps2_mouse: клики проходят, но нужна живая PS/2-мышь
#                 (тачпад ноутбука; сейчас у него отключён шлейф).
mouse = "sendinput"
# mouse_packet = 3           # mouse = "ps2": пакет мыши, 3 — обычная, 4 — с колесом

[combat]
# Тайминг нажатий умений (значения по умолчанию, обычно менять не нужно).
# press_cooldown = 0.35     # дольше этого подтверждения нажатия умения не ждём, с
# confirm_seconds = 0.2     # раньше этого срока результат нажатия не оцениваем, с
# confirm_frames = 2        # сколько свежих кадров аддона ждать после нажатия
# gcd_lookahead = 0.06      # за столько до конца ГКД выбрать умение и ждать, с
# gcd_lead = 0.0            # нажать за столько до расчётного конца ГКД, с
# queue_during_cast = true  # жать следующее умение во время каста (игра ставит в очередь)
# cast_queue_after = 0.3    # но не раньше, чем через столько после начала каста, с

[safety]
stop_key = "f12"      # остановить бота
stale_seconds = 1.0   # если данные от аддона старше — бот ничего не делает

[assist]
# Режим боя-помощник (python -m aobot assist).
key = "f9"                          # включает бой по текущей цели (выключается сам)
chat_keys = ["enter", "backspace"]  # эти клавиши открывают чат — бот выключается
chat_close_keys = ["enter", "esc"]  # эти закрывают чат (клик мышью чат не закрывает);
                                    # пока чат открыт, key не действует — можно взять и букву, например "e"
# Клавиши не должны совпадать между собой, со stop_key и с клавишами [[rotation]].
# Внимание: F12 в игре по умолчанию открывает «Сумку и экипировку» — stop_key можно сменить.

# Ротация: проверяется сверху вниз, нажимается первое подходящее готовое умение.
# spell — номер умения в списке BOT_SPELLS из addon/BotBridge/Scripts/Config.lua.

[[rotation]]          # лечение — срабатывает раньше атак, если здоровье низкое
spell = 3
key = "3"
self_hp_below = 45

[[rotation]]          # добивание
spell = 2
key = "2"
max_target_hp = 25

[[rotation]]          # основная атака
spell = 1
key = "1"
