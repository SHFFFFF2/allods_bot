# Настройки под текущего персонажа. spell = N — N-й по счёту слот панели, где лежит
# умение (слоты 1..36 по порядку, пустые и не-умения не считаются). Панель 2026-11-18
# (слоты 1–12 заняты подряд, поэтому номер = номер слота):
#  1 Изъятие жизни (1)   2 Дыхание смерти (2)   3 Касание смерти (3)   4 Алчные тени (4)
#  5 Лихорадка (5)       6 Нейротоксин (6)      7 Вирус (7)            8 Разъедающий плевок (8)
#  9 Кровавый пир (9)   10 Липкая жижа (0)     11 Сила Света (-)      12 Милость (=)
# 13 Удушливый токсин (alt+2)  14 Очищение (alt+4)  15 Восстановление (alt+5)
# 16 Кровавая корка (alt+6)
# Переставили умения на панели — поправьте номера и клавиши.

[input]
# Клавиши всегда идут через PS/2 (драйвер InpOut от Clickermann), как #ps2_keyboard.
# Мышь:
#   "sendinput" — курсор двигается, клики игра не принимает (как мышь Clickermann без #ps2_mouse);
#   "ps2"       — пакеты PS/2-мыши, как #ps2_mouse: клики проходят, но нужна живая PS/2-мышь
#                 (тачпад ноутбука; сейчас у него отключён шлейф).
mouse = "sendinput"
# mouse_packet = 3           # mouse = "ps2": пакет мыши, 3 — обычная, 4 — с колесом

[assist]
key = "e"            # включить бой по текущей цели; пока открыт чат — не действует

[safety]
stop_key = "f12"
stale_seconds = 1.0

# every = N — не жать умение чаще раза в N секунд (держать периодический урон).

[[rotation]]          # Резонансный барьер
spell = 5
key = "5"
self_hp_below = 60

[[rotation]]          # Гимн победы
spell = 8
key = "-"

[[rotation]]          # Мелодия войны
spell = 7
key = "9"

[[rotation]]          # Дисгармония
spell = 1
key = "1"
every = 2

[[rotation]]          # Соло
spell = 11
key = "alt+2"

[[rotation]]          # Крещендо
spell = 2
key = "2"

[[rotation]]          # Марш
spell = 10
key = "alt+1"

